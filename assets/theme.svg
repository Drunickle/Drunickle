<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="1200px" height="530px" font-size="13.5px">
    <style>
        @font-face {
        src: local('Consolas'), local('Consolas Bold');
        font-family: 'ConsolasFallback';
        font-display: swap;
        -webkit-size-adjust: 109%;
        size-adjust: 109%;
        }
        .key {fill: #9d9effff;}
        .value {fill: #ffffffff;}
        .addColor {fill: #3fb950;}
        .delColor {fill: #f85149;}
        .cc {fill: #616e7f;}
        text, tspan {white-space: pre;}
    </style>

    <!-- Background -->
    <rect width="1500px" height="530px" fill="#161b22" rx="15"/>

    <!-- ASCII LOGO (compact version) -->
    <text x="0" y="100" fill="#E0E0E0" class="ascii">
        <tspan x="140" y="100">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ </tspan>
        <tspan x="140" y="120">@@@@@@@@@@@@@@@@@@@@%%%%@@@@@@@@@@@@@@@@ </tspan>
        <tspan x="140" y="140">@@@@@@@@@@@@@@@@@@%#+..-#@@@@@@@@@@@@@@@ </tspan>
        <tspan x="140" y="160">@@@@@@@@@@@@@@@@@@%*.  -#@@@@@@@@@@@@@@@ </tspan>
        <tspan x="140" y="180">@@@@@@@@@@%#+==*%%#-  .+%@@@@@%%%#*+#%@@ </tspan>
        <tspan x="140" y="200">@@@@@@@@@%#:    =#+   -#@%%#*=:.    .*%% </tspan>
        <tspan x="140" y="220">@@@@@@@@@%#-   .++:  .*%%#:       .-*%%% </tspan>
        <tspan x="140" y="240">@@%*++++++++===+=.   -#%*:   :=*#%%@@@%* </tspan>
        <tspan x="140" y="260">@%*:                  -=.   -#@@@@@@@@%+ </tspan>
        <tspan x="140" y="280">@@%#*+++====-.             -#%@@@@@@@@%+ </tspan>
        <tspan x="140" y="300">@@@@@@@@@@@@@%#=.         :*##%@@@@@@@%+ </tspan>
        <tspan x="140" y="320">@@@@@@@@@@@@@@@%%*-.         .-#%@@@@@%+ </tspan>
        <tspan x="140" y="340">@@@@@@@@@@@@@@@@@@%#*-.   ..   .=#%@@@%+ </tspan>
        <tspan x="140" y="360">@@@@@@@@@@@@@@@@@@@@%%%%%%%%*:   .=%%@%+ </tspan>
        <tspan x="140" y="380">@@@@@@@@@@@@@@@@@@@@@@@@@@@@%#+:   :+%%+ </tspan>
        <tspan x="140" y="400">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%=.  :#%+ </tspan>
        <tspan x="140" y="420">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ </tspan>
        <tspan x="140" y="440">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@ </tspan>
    </text>

    <!-- INFO PANEL -->
    <text x="600" y="30" fill="#c9d1d9">
        <tspan x="600" y="30">Tyler Marlow</tspan> -——————————————————————————————————————————————————
        <tspan x="600" y="70" class="cc">. </tspan><tspan class="key">Uptime</tspan>:<tspan class="cc" id="age_data_dots"> ............................................. </tspan><tspan class="value" id="age_data">21 years</tspan>
        <tspan x="600" y="110" class="cc">. </tspan><tspan class="key">Location</tspan>:<tspan class="cc"> ........................ </tspan><tspan class="value">Kazakhstan (Born in Russia)</tspan>
        <tspan x="600" y="130" class="cc">. </tspan><tspan class="key">IDE</tspan>:<tspan class="cc"> ....................................... </tspan><tspan class="value">JetBrains, Pulsar</tspan>
        <tspan x="600" y="170" class="cc">. </tspan><tspan class="key">Languages</tspan>.<tspan class="key">Programming</tspan>:<tspan class="cc"> ........................ </tspan><tspan class="value">Go, TypeScript</tspan>
        <tspan x="600" y="210" class="cc">. </tspan><tspan class="key">Languages</tspan>.<tspan class="key">Real</tspan>:<tspan class="cc"> ............................. </tspan><tspan class="value">English, Russian</tspan>
        <tspan x="600" y="250" class="cc">. </tspan><tspan class="key">Hobbies</tspan>.<tspan class="key">Software</tspan>:<tspan class="cc"> ............................... </tspan><tspan class="value">Modding, EDM</tspan>
        <tspan x="600" y="270" class="cc">. </tspan><tspan class="key">Hobbies</tspan>.<tspan class="key">Hardware</tspan>:<tspan class="cc"> ....... </tspan><tspan class="value">In-house Producing, Game Translation</tspan>

        <tspan x="600" y="310">- Contact</tspan> -—————————————————————————————————————————————————————
        <tspan x="600" y="330" class="cc">. </tspan><tspan class="key">Email</tspan>.<tspan class="key">Work</tspan>:<tspan class="cc"> ............................... </tspan><tspan class="value">flaecord@gmail.com</tspan>
        <tspan x="600" y="350" class="cc">. </tspan><tspan class="key">Email</tspan>.<tspan class="key">Personal</tspan>:<tspan class="cc"> ........................................... </tspan><tspan class="value">NA</tspan>
        <tspan x="600" y="390" class="cc">. </tspan><tspan class="key">Instagram</tspan>:<tspan class="cc"> ........................................ </tspan><tspan class="value">@drunickle</tspan>
        <tspan x="600" y="410" class="cc">. </tspan><tspan class="key">Twitch</tspan>:<tspan class="cc"> ........................................ </tspan><tspan class="value">ttv/drunickle</tspan>


        <tspan x="600" y="450">- GitHub Stats</tspan> -————————————————————————————————————————————————
        <tspan x="600" y="470" class="cc">. </tspan><tspan class="key">Repos</tspan>:<tspan class="cc" id="repo_data_dots"> .... </tspan><tspan class="value" id="repo_data">1</tspan> {<tspan class="key">Contributed</tspan>: <tspan class="value" id="contrib_data">1</tspan>} | <tspan class="key">Stars</tspan>:<tspan class="cc" id="star_data_dots"> ............. </tspan><tspan class="value" id="star_data">0</tspan>
        <tspan x="600" y="490" class="cc">. </tspan><tspan class="key">Commits</tspan>:<tspan class="cc" id="commit_data_dots"> ................... </tspan><tspan class="value" id="commit_data">1</tspan> | <tspan class="key">Followers</tspan>:<tspan class="cc" id="follower_data_dots"> ......... </tspan><tspan class="value" id="follower_data">0</tspan>
        <tspan x="600" y="510" class="cc">. </tspan><tspan class="key">Lines of Code on GitHub</tspan>:<tspan class="cc" id="loc_data_dots"> ... </tspan><tspan class="value" id="loc_data">0</tspan> ( <tspan class="addColor" id="loc_add">0</tspan><tspan class="addColor">++</tspan>, <tspan id="loc_del_dots"></tspan><tspan class="delColor" id="loc_del">0</tspan><tspan class="delColor">--</tspan> )
    </text>
</svg>
